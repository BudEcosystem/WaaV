        enable_metrics:
          type: boolean
          description: Enable DAG metrics collection
        template:
          type:
          - string
          - 'null'
          description: Name of a pre-registered DAG template to use
          example: voice-assistant
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum execution timeout in milliseconds
          example: 30000
          minimum: 0
    DeleteSipHooksRequest:
      type: object
      description: |-
        Request body for deleting SIP hooks.

        Contains a list of host names to remove from the SIP hooks cache.
      properties:
        hosts:
          type: array
          items:
            type: string
          description: |-
            List of host names to remove (case-insensitive).
            Hosts that exist in the original config will revert to their config values.
          example:
          - example.com
