        provider:
          type: string
          description: Provider name (e.g. `deepgram`).
        reachable:
          type:
          - boolean
          - 'null'
          description: |-
            TCP reachability of the provider endpoint: `Some(true/false)` if probed, `None` if the
            host could not be resolved/derived (treated as not-ready).
        ready:
          type: boolean
          description: Whether this provider is fully ready (credential present AND reachable).
    ReadinessReport:
      type: object
      description: The aggregate `/readyz` report.
      required:
      - status
      - config_loaded
      - providers
      properties:
        config_loaded:
          type: boolean
          description: Whether configuration is loaded (always true once `AppState` exists).
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderReadiness'
          description: Per-provider breakdown.
        status:
          type: string
          description: '`"ready"` when every enabled provider is ready, else `"not_ready"`.'
    ReasoningEffort:
      type: string
      description: |-
        D1 (REALTIME_REASONING.md §4.1): the reasoning/thinking-effort dial — ONE
        typed knob the adapter maps to each vendor's native control, clamped to the
        model's floor. `Off` *minimizes* thinking; it is not always literally zero,
        because some 2026 models are adaptive-thinking-only and have a floor — the
        resolved value is echoed back to the client so the floor is observable.

        Cascade (Chat-Completions) wire forms, AT MOST ONE param per vendor. `Off`/
        `None` emit NOTHING on every vendor: a non-reasoning model 400s on any
        thinking param (live-verified against ollama "does not support thinking"),
        so the safe floor is to send no param at all rather than an explicit zero.
        - OpenAI: flat string `reasoning_effort` (`Off`→omit);
        - Anthropic: `thinking { type:"enabled", budget_tokens }` (`Off`→omit;
          adaptive-only models that reject the param also omit);
        - Gemini: `generationConfig.thinkingConfig.thinkingBudget` (`Off`→omit) —
          never paired with `thinkingLevel` (that 400s).
      enum:
      - off
      - minimal
      - low
      - medium
      - high
    RemoveParticipantErrorResponse:
      type: object
      description: |-
        Error response for participant removal failures

        # Example
        ```json
        {
          "error": "Participant 'user-123' not found in room",
          "code": "PARTICIPANT_NOT_FOUND"
        }
        ```
      required:
      - error
      - code
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: PARTICIPANT_NOT_FOUND
        error:
          type: string
          description: Human-readable error message
          example: Participant not found in room
    RemoveParticipantRequest:
      type: object
      description: |-
        Request body for removing a participant from a LiveKit room

        # Example
        ```json
        {
          "room_name": "conversation-room-123",
          "participant_identity": "user-alice-456"
        }
        ```
      required:
      - room_name
      - participant_identity
      properties:
        participant_identity:
          type: string
          description: The identity of the participant to remove
          example: user-alice-456
        room_name:
          type: string
          description: The LiveKit room name where the participant is connected
          example: conversation-room-123
    RemoveParticipantResponse:
      type: object
      description: |-
        Response for a successful participant removal

        # Example
        ```json
        {
          "status": "removed",
          "room_name": "project1_conversation-room-123",
          "participant_identity": "user-alice-456"
        }
        ```
      required:
      - status
      - room_name
      - participant_identity
      properties:
        participant_identity:
          type: string
          description: The identity of the removed participant
          example: user-alice-456
        room_name:
          type: string
          description: The normalized room name (with tenant prefix)
          example: project1_conversation-room-123
        status:
          type: string
          description: Status of the removal operation
          example: removed
    RoomDetailsResponse:
      type: object
      description: |-
        Detailed information about a LiveKit room including participants

        # Example
        ```json
        {
          "sid": "RM_xyz789",
          "name": "project1_conversation-room-123",
          "num_participants": 2,
          "max_participants": 10,
          "creation_time": 1703123456,
          "metadata": "",
          "active_recording": false,
          "participants": [...]
        }
        ```
      required:
      - sid
      - name
      - num_participants
      - max_participants
      - creation_time
      - metadata
      - active_recording
      - participants
      properties:
        active_recording:
          type: boolean
          description: Whether a recording is currently active
          example: false
        creation_time:
          type: integer
          format: int64
          description: Room creation time (Unix timestamp in seconds)
          example: 1703123456
        max_participants:
          type: integer
          format: int32
          description: Maximum allowed participants (0 = no limit)
          example: 10
          minimum: 0
        metadata:
          type: string
          description: User-specified metadata for the room
          example: ''
        name:
          type: string
          description: The full room name (includes tenant prefix)
          example: project1_conversation-room-123
        num_participants:
          type: integer
          format: int32
          description: Number of current participants in the room
          example: 2
          minimum: 0
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantInfo'
          description: List of participants currently in the room
        sid:
          type: string
          description: Unique session ID for the room (generated by LiveKit)
          example: RM_xyz789
    RoomInfo:
      type: object
      description: |-
        Information about a LiveKit room

        # Example
        ```json
        {
          "name": "project1_conversation-room-123",
          "num_participants": 2,
          "creation_time": 1703123456
        }
        ```
      required:
      - name
      - num_participants
      - creation_time
      properties:
        creation_time:
          type: integer
          format: int64
          description: Room creation time (Unix timestamp in seconds)
          example: 1703123456
        name:
          type: string
          description: The full room name (includes tenant prefix)
          example: project1_conversation-room-123
        num_participants:
          type: integer
          format: int32
          description: Number of current participants in the room
          example: 2
          minimum: 0
    RoutingMode:
      type: string
      description: |-
        S2 (REALTIME_REASONING.md §5): when a `reasoning_model` is configured, how to
        route each turn between the fast `model` and the slow reasoning tier.
      enum:
      - auto
      - always
    SIPTransferErrorResponse:
      type: object
      description: |-
        Error response for SIP transfer failures

        # Example
        ```json
        {
          "error": "Participant 'sip_123' not found or is not a SIP participant",
          "code": "PARTICIPANT_NOT_FOUND"
        }
        ```
      required:
      - error
      - code
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: PARTICIPANT_NOT_FOUND
        error:
          type: string
          description: Human-readable error message
          example: Participant not found or is not a SIP participant
    SIPTransferRequest:
      type: object
      description: |-
        Request body for initiating a SIP call transfer

        # Example
        ```json
        {
          "room_name": "call-room-123",
          "participant_identity": "sip_participant_456",
          "transfer_to": "+15551234567"
        }
        ```
      required:
      - room_name
      - participant_identity
      - transfer_to
      properties:
        participant_identity:
          type: string
          description: |-
            The identity of the SIP participant to transfer.
            This can be obtained by listing participants in the room via LiveKit API.
          example: sip_participant_456
        room_name:
          type: string
          description: The LiveKit room name where the SIP participant is connected
          example: call-room-123
        transfer_to:
          type: string
          description: |-
            The phone number to transfer the call to.
            Supports international format (+1234567890), national format (07123456789),
            or internal extensions (1234).
          example: '+15551234567'
    SIPTransferResponse:
      type: object
      description: |-
        Response for a successful SIP transfer initiation

        Note: A successful response indicates the transfer has been initiated,
        not that it has completed. The actual transfer may take several seconds.

        # Example
        ```json
        {
          "status": "initiated",
          "room_name": "call-room-123",
          "participant_identity": "sip_participant_456",
          "transfer_to": "tel:+15551234567"
        }
        ```
      required:
      - status
      - room_name
      - participant_identity
      - transfer_to
      properties:
        participant_identity:
          type: string
          description: The identity of the participant being transferred
          example: sip_participant_456
        room_name:
          type: string
          description: The room name where the transfer was initiated
          example: call-room-123
        status:
          type: string
          description: Status of the transfer request ("initiated" or "completed")
          example: initiated
        transfer_to:
          type: string
          description: 'The normalized phone number with tel: prefix'
          example: tel:+15551234567
    STTWebSocketConfig:
      type: object
      description: STT configuration for WebSocket messages (with optional API key)
      required:
      - provider
      - language
      - sample_rate
      - channels
      - punctuation
      properties:
        api_key:
          type:
          - string
          - 'null'
          description: Optional API key for this provider (overrides server config)
        channels:
          type: integer
          format: int32
          description: Number of audio channels (1 for mono, 2 for stereo)
          example: 1
          minimum: 0
        encoding:
          type: string
          description: Encoding of the audio. Optional — defaults to `linear16` (16-bit PCM) when omitted.
          example: linear16
        extras:
          $ref: '#/components/schemas/ProviderExtras'
          description: Open, typed passthrough for provider-specific parameters not modeled by `features`.
        features:
          $ref: '#/components/schemas/SttFeatures'
          description: |-
            Canonical, provider-agnostic advanced STT features (diarization, keyterms, redaction,
            vad_events, …). Defaults to all-unset so existing clients are unaffected; carried across the
            dispatch boundary via [`Self::to_standard_stt`] so providers with a `from_standard` mapping
            (Deepgram first) honor them END-TO-END (W1 keystone, closing BRUTAL_REVIEW.md S1).
        language:
          type: string
          description: Language code for transcription (e.g., "en-US", "es-ES")
          example: en-US
        model:
          type: string
          description: |-
            Model to use for transcription. Optional — defaults to empty, letting the provider pick its
            own default model (each provider maps an empty model to its recommended default).
          example: nova-2
        provider:
          type: string
          description: Provider name (e.g., "deepgram")
          example: deepgram
        punctuation:
          type: boolean
          description: Enable punctuation in results
          example: true
        sample_rate:
          type: integer
          format: int32
          description: Sample rate of the audio in Hz
          example: 16000
          minimum: 0
        turn_detection:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TurnDetectionWsConfig'
            description: |-
              ML turn detection for this session (P1.2): runs the audio-based
              smart-turn detector on the live frame path so end-of-turn is PREDICTED
              instead of waiting out the provider's silence endpointing. Standardized
              — provider-agnostic, applies to every STT provider. Requires a build
              with the `smart-turn`/`silero-vad` features; otherwise the session
              degrades LOUDLY (warn + waav_degraded_total) to timer fallback.
    SipHookEntry:
      type: object
      description: A single SIP hook entry.
      required:
      - host
      - url
      properties:
        host:
          type: string
          description: Host pattern for matching SIP domains (case-insensitive)
          example: example.com
        url:
          type: string
          description: HTTPS URL to forward webhook events to
          example: https://webhook.example.com/events
    SipHooksErrorResponse:
      type: object
      description: Error response for SIP hooks operations.
      required:
      - error
      properties:
        error:
          type: string
          description: Error message describing what went wrong
          example: 'Duplicate host detected: example.com'
    SipHooksRequest:
      type: object
      description: |-
        Request body for updating SIP hooks.

        Contains a list of SIP webhook configurations to add or replace.
      properties:
        hooks:
          type: array
          items:
            $ref: '#/components/schemas/SipHookEntry'
          description: |-
            List of SIP hooks to add or replace.
            Hooks with matching hosts (case-insensitive) will be replaced.
    SipHooksResponse:
      type: object
      description: Response body for SIP hooks operations.
      required:
      - hooks
      properties:
        hooks:
          type: array
          items:
            $ref: '#/components/schemas/SipHookEntry'
          description: List of all configured SIP hooks
    SpeakRequest:
      type: object
      description: Request body for the speak endpoint
      required:
      - text
      - tts_config
      properties:
        text:
          type: string
          description: The text to synthesize
          example: Hello, world!
        tts_config:
          $ref: '#/components/schemas/TTSWebSocketConfig'
          description: TTS configuration (without API key)
    SttFeatures:
      type: object
      description: |-
        Canonical, provider-agnostic advanced STT features. Every field is `Option`, so `None`
        means "don't request / use the provider default" and adding fields stays backward compatible.
      properties:
        alternatives:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Number of N-best alternative hypotheses to return (Deepgram / Google `alternatives` /
            `maxAlternatives`).
          minimum: 0
        diarization:
          type:
          - boolean
          - 'null'
          description: Speaker diarization (who-spoke-when).
        endpointing_ms:
          type:
          - integer
          - 'null'
          format: int32
          description: Silence (ms) after speech before finalizing an utterance.
          minimum: 0
        entity_detection:
          type:
          - boolean
          - 'null'
          description: Named-entity detection.
        filler_words:
          type:
          - boolean
          - 'null'
          description: Include filler words ("uh", "um") rather than dropping them.
        interim_results:
          type:
          - boolean
          - 'null'
          description: Emit interim (non-final) hypotheses as they are recognized.
        keyterms:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Key terms / phrases to boost (canonical; maps to keyterm / keywords / phrase hints).
        language_detection:
          type:
          - boolean
          - 'null'
          description: Automatic spoken-language detection.
        multichannel:
          type:
          - boolean
          - 'null'
          description: |-
            Transcribe each audio channel independently, with per-channel speakers
            (Deepgram / AssemblyAI `multichannel`).
        numerals:
          type:
          - boolean
          - 'null'
          description: Convert spoken numbers to digits / numeric formatting (Deepgram `numerals`).
        profanity_filter:
          type:
          - boolean
          - 'null'
          description: Profanity filtering / masking.
        redaction:
          type:
          - array
          - 'null'
          items:
            type: string
          description: PII/PHI categories to redact (canonical category names).
        sentiment:
          type:
          - boolean
          - 'null'
          description: Per-utterance sentiment analysis (Deepgram / AssemblyAI `sentiment`).
        smart_format:
          type:
          - boolean
          - 'null'
          description: Provider "smart formatting" (dates, numbers, etc.).
        speech_begin_event:
          type:
          - boolean
          - 'null'
          description: |-
            Emit a discrete "speech started" event when the recognizer first detects speech
            (IBM Watson `speech_begin_event`). Distinct from `vad_events` (which is the canonical
            flag for continuous voice-activity/endpointing events): this requests the single
            begin-of-speech marker IBM emits as a `speaker_begin`/`speech_begin` notification.
        utterance_end_ms:
          type:
          - integer
          - 'null'
          format: int32
          description: Idle (ms) before emitting an utterance-end event.
          minimum: 0
        vad_events:
          type:
          - boolean
          - 'null'
          description: Emit explicit voice-activity / endpointing events.
        word_timestamps:
          type:
          - boolean
          - 'null'
          description: Per-word start/end timestamps.
    TTSWebSocketConfig:
      type: object
      description: TTS configuration for WebSocket messages (with optional API key)
      required:
      - provider
      - model
      properties:
        api_key:
          type:
          - string
          - 'null'
          description: Optional API key for this provider (overrides server config)
        audio_format:
          type:
          - string
          - 'null'
          description: Audio format preference
          example: linear16
        audio_out_chunk_ms:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            WS egress re-framing (E-G2): when set, PCM TTS audio is sliced into
            chunks of this many milliseconds before the WebSocket send, so a
            barge-in clear truncates within ONE chunk instead of letting a whole
            synthesis frame play out client-side. Omitted = verbatim frames
            (legacy). LiveKit egress already frames at 10ms internally.
          example: 20
          minimum: 0
        client_playback_rate:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Client playback rate (C-G5): when set, the gateway resamples PCM TTS
            egress from the provider's rate to THIS rate before delivery (WS
            binary and LiveKit), so clients with a fixed-rate audio sink never
            resample provider-side or client-side. Identity (provider already at
            this rate) is zero-cost; non-PCM formats pass through unchanged.
          example: 48000
          minimum: 0
        connection_timeout:
          type:
          - integer
          - 'null'
          format: int64
          description: Connection timeout in seconds
          example: 30
          minimum: 0
        delivery_style:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DeliveryStyle'
            description: |-
              Delivery style modifier for speech.

              Affects pacing and prosody independently of emotion.
              Examples: "whispered", "shouted", "rushed", "measured", "expressive"
        emotion:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Emotion'
            description: |-
              Emotion to express in speech synthesis.

              Supported by: Hume AI (all), ElevenLabs (core set), Azure (SSML styles).
              Providers without emotion support will synthesize speech normally with a warning.

              Examples: "happy", "sad", "angry", "excited", "calm", "sarcastic"
        emotion_description:
          type:
          - string
          - 'null'
          description: |-
            Free-form emotion description (for providers like Hume AI).

            When provided, this takes precedence over the `emotion` field for Hume AI.
            Maximum 100 characters.

            Examples: "warm, friendly, inviting", "whispered fearfully", "sarcastic, dry"
          example: warm, friendly, inviting
        emotion_intensity:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EmotionIntensity'
            description: |-
              Intensity of the emotion (0.0 to 1.0, or "low"/"medium"/"high").

              - 0.0-0.3: Subtle expression
              - 0.4-0.7: Moderate expression (default: 0.6)
              - 0.8-1.0: Strong expression

              Alternatively, use named levels: "low" (0.3), "medium" (0.6), "high" (1.0)
        extras:
          $ref: '#/components/schemas/ProviderExtras'
          description: Open, typed passthrough for provider-specific parameters not modeled by `features`.
        features:
          $ref: '#/components/schemas/TtsFeatures'
          description: |-
            Canonical, provider-agnostic advanced TTS features (voice settings, instructions, SSML,
            streaming, …). Defaults to all-unset so existing clients are unaffected; carried across the
            dispatch boundary via [`Self::to_standard_tts`] so providers with a `from_standard` mapping
            (Deepgram first) honor them END-TO-END (W1 keystone, closing BRUTAL_REVIEW.md S1/S5).
        model:
          type: string
          description: Model to use for TTS
          example: aura-asteria-en
        pronunciations:
          type: array
          items:
            $ref: '#/components/schemas/Pronunciation'
          description: Pronunciation replacements to apply before TTS
        provider:
          type: string
          description: Provider name (e.g., "deepgram", "hume", "elevenlabs")
          example: deepgram
        request_timeout:
          type:
          - integer
          - 'null'
          format: int64
          description: Request timeout in seconds
          example: 60
          minimum: 0
        sample_rate:
          type:
          - integer
          - 'null'
          format: int32
          description: Sample rate preference
          example: 24000
          minimum: 0
        speaking_rate:
          type:
          - number
          - 'null'
          format: float
          description: Speaking rate (0.25 to 4.0, 1.0 is normal)
          example: 1.0
        voice_id:
          type:
          - string
          - 'null'
          description: Voice ID or name to use for synthesis
          example: aura-asteria-en
    TokenRequest:
      type: object
      description: |-
        Request body for generating a LiveKit token

        # Example
        ```json
        {
          "room_name": "conversation-room-123",
          "participant_name": "Alice Smith",
          "participant_identity": "user-alice-456"
        }
        ```
      required:
      - room_name
      - participant_name
      - participant_identity
      properties:
        participant_identity:
          type: string
          description: Unique identifier for the participant (e.g., "user-123")
          example: user-alice-456
        participant_name:
          type: string
          description: Display name for the participant (e.g., "John Doe")
          example: Alice Smith
        room_name:
          type: string
          description: The LiveKit room name to generate a token for
          example: conversation-room-123
    TokenResponse:
      type: object
      description: |-
        Response containing the generated LiveKit token

        # Example
        ```json
        {
          "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "room_name": "conversation-room-123",
          "participant_identity": "user-alice-456",
          "livekit_url": "ws://localhost:7880"
        }
        ```
      required:
      - token
      - room_name
      - participant_identity
      - livekit_url
      properties:
        livekit_url:
          type: string
          description: The LiveKit server URL to connect to
          example: ws://localhost:7880
        participant_identity:
          type: string
          description: Echo back the participant identity for client confirmation
          example: user-alice-456
        room_name:
          type: string
          description: Echo back the room name for client confirmation
          example: conversation-room-123
        token:
          type: string
          description: The generated JWT token for LiveKit
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    TtsFeatures:
      type: object
      description: Canonical, provider-agnostic advanced TTS features. Every field is `Option`.
      properties:
        emotion:
          type:
          - string
          - 'null'
          description: Emotion / delivery (e.g. "happy", "cheerful"); maps to provider emotion controls.
        include_timestamp_types:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            Request specific timestamp granularities in the response (Hume `include_timestamp_types`:
            `"word"` and/or `"phoneme"`). Canonical superset of the boolean `word_timestamps` flag for
            providers that expose per-type timestamp selection. Pure metadata request: does NOT change
            the synthesized audio (so providers must NOT fold it into the audio cache key).
        instructions:
          type:
          - string
          - 'null'
          description: Free-form delivery instructions (OpenAI gpt-4o-mini-tts `instructions`, Hume `description`).
        language:
          type:
          - string
          - 'null'
          description: Synthesis language override.
        optimize_streaming_latency:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Streaming latency-optimization tier 0-4, trading quality for lower TTFB
            (ElevenLabs `optimize_streaming_latency`).
          minimum: 0
        pitch:
          type:
          - number
          - 'null'
          format: float
          description: Pitch adjustment.
        pitch_percentage:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Pitch adjustment as a signed percentage delta from the per-voice default
            (IBM Watson `pitch_percentage`: 0 = normal, +50 = 50% higher, -50 = 50% lower).
            Distinct from the absolute [`pitch`](Self::pitch): this is the provider's native
            percentage-delta knob.
        rate_percentage:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Speaking-rate adjustment as a signed percentage delta from the per-voice default
            (IBM Watson `rate_percentage`: 0 = normal, +50 = 50% faster, -50 = 50% slower).
            Distinct from the multiplicative [`speed`](Self::speed): this is the provider's native
            percentage-delta knob so the value reaches the wire 1:1 without a lossy multiplier round-trip.
        sample_rate:
          type:
          - integer
          - 'null'
          format: int32
          description: Output sample rate override.
          minimum: 0
        seed:
          type:
          - integer
          - 'null'
          format: int64
          description: Determinism seed where the provider supports it.
          minimum: 0
        similarity_boost:
          type:
          - number
          - 'null'
          format: float
          description: ElevenLabs-style similarity boost.
        speed:
          type:
          - number
          - 'null'
          format: float
          description: Speaking speed multiplier / level (provider-specific range).
        ssml:
          type:
          - boolean
          - 'null'
          description: Treat the input text as SSML (unlocks Azure `mstts:express-as`, etc.).
        stability:
          type:
          - number
          - 'null'
          format: float
          description: ElevenLabs-style voice stability.
        streaming:
          type:
          - boolean
          - 'null'
          description: Prefer the provider's streaming endpoint (lower TTFB).
        style:
          type:
          - number
          - 'null'
          format: float
          description: ElevenLabs-style style exaggeration.
        use_speaker_boost:
          type:
          - boolean
          - 'null'
          description: ElevenLabs-style speaker boost.
        volume:
          type:
          - number
          - 'null'
          format: float
          description: Volume / loudness adjustment.
        word_timestamps:
          type:
          - boolean
          - 'null'
          description: Request word-level timestamps in the response.
    TurnDetectionWsConfig:
      type: object
      description: Per-session ML turn-detection knobs (provider-agnostic).
      required:
      - enabled
      properties:
        eager:
          type: boolean
          description: |-
            Eager end-of-turn: on a turn-complete prediction, start the LLM
            speculatively (held + staged; see conversation_config.eager_eot which
            must also be enabled). Default false.
        enabled:
          type: boolean
          description: Master switch.
        threshold:
          type:
          - number
          - 'null'
          format: float
          description: Decision threshold (model-calibrated default when omitted).
    UnifiedMessage:
      type: object
      description: Unified message structure for all incoming messages from various sources
      required:
      - identity
      - topic
      - room
      - timestamp
      properties:
        data:
          type:
          - string
          - 'null'
          description: Binary data encoded as base64 (optional)
        identity:
          type: string
          description: Participant/sender identity
        message:
          type:
          - string
          - 'null'
          description: Text message content (optional)
        room:
          type: string
          description: Room/space identifier
        timestamp:
          type: integer
          format: int64
          description: Timestamp when the message was received
          minimum: 0
        topic:
          type: string
          description: Topic/channel for the message
    Voice:
      type: object
      required:
      - id
      - sample
      - name
      - accent
      - gender
      - language
      properties:
        accent:
          type: string
          description: Accent or dialect
          example: American
        gender:
          type: string
          description: Gender of the voice
          example: Female
        id:
          type: string
          description: Voice ID or canonical name
          example: aura-asteria-en
        language:
          type: string
          description: Language supported by the voice
          example: English
        name:
          type: string
          description: Display name of the voice
          example: Asteria
        sample:
          type: string
          description: URL to sample audio
          example: https://example.com/sample.mp3
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the authentication service. Required when AUTH_REQUIRED is enabled.
