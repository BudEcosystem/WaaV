#     # A card that says it has an authenticated extended card is followed by that card,
#     # asked for with the entry's secret (GetExtendedAgentCard). With push_base_url (the
#     # gateway's address as the agent reaches it) and a card that says pushNotifications, a
#     # task's first message carries a push configuration (<push_base_url>/v1/tasks/<task_id>/
#     # callback and a token of the task's); its pushes are read as a stream's events, and
