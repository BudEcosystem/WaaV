# WaaV Gateway Configuration File Example
#
# This file demonstrates all available configuration options.
# Copy this file to config.yaml and customize as needed.
#
# Usage: waav-gateway -c config.yaml
#
# Priority: YAML values > Environment variables > .env file > Defaults
# This means YAML configuration takes precedence over environment variables,
# allowing you to use env vars as base config and YAML for overrides.

# Server configuration
server:
  host: "0.0.0.0"      # ENV: HOST
  port: 3001           # ENV: PORT

  # TLS configuration (optional)
  # Enable for HTTPS/WSS support
  # Both cert_path and key_path must be provided when enabled
  tls:
    enabled: false                    # ENV: TLS_ENABLED (true/false/1/0/yes/no)
    cert_path: "/path/to/cert.pem"    # ENV: TLS_CERT_PATH (PEM format)
    key_path: "/path/to/key.pem"      # ENV: TLS_KEY_PATH (PEM format)

# LiveKit configuration
livekit:
  url: "ws://localhost:7880"              # ENV: LIVEKIT_URL
  public_url: "http://localhost:7880"     # ENV: LIVEKIT_PUBLIC_URL
  api_key: "your-livekit-api-key"         # ENV: LIVEKIT_API_KEY
  api_secret: "your-livekit-api-secret"   # ENV: LIVEKIT_API_SECRET

# Provider API keys
providers:
  # Deepgram: each STT model gets a language code it takes (the caller's own when the model
  # lists it); whisper-* models are file-only (POST /transcribe/batch, refused on /ws).
  deepgram_api_key: "your-deepgram-api-key"     # ENV: DEEPGRAM_API_KEY
  # ElevenLabs: also used by POST /transcribe/batch when the request's api_key is empty.
  elevenlabs_api_key: "your-elevenlabs-api-key" # ENV: ELEVENLABS_API_KEY
  # ElevenLabs text-to-speech: tts_config.features.streaming: true synthesises on the HTTP
  # streaming endpoint (/v1/text-to-speech/{voice}/stream), audio as it is made. A proxy or a
  # stand-in for the vendor is set in the environment only: ELEVENLABS_TTS_URL (default
  # https://api.elevenlabs.io/v1/text-to-speech).

  # Google Cloud settings (used for both Speech-to-Text and Text-to-Speech)
  # Authentication options (in order of precedence):
  # 1. Path to service account JSON file
  # 2. JSON content string (starts with '{')
  # 3. Empty string to use Application Default Credentials (ADC)
  # Note: project_id is automatically extracted from the credentials JSON
  google_credentials: ""                         # ENV: GOOGLE_APPLICATION_CREDENTIALS

  # Microsoft Azure Speech Services settings (used for both STT and TTS)
  # Get these from Azure Portal → Your Speech resource → Keys and Endpoint
  # IMPORTANT: The subscription key is tied to a specific Azure region.
  # Using a key with the wrong region will result in 401 Unauthorized errors.
  azure_speech_subscription_key: ""              # ENV: AZURE_SPEECH_SUBSCRIPTION_KEY
  # Azure region where your Speech resource was created
  # Common regions: eastus, westus, westus2, westeurope, northeurope, eastasia, southeastasia
  # Note: Both STT and TTS use the same region setting
  azure_speech_region: "eastus"                  # ENV: AZURE_SPEECH_REGION (default: eastus)

  # Cartesia API key (used for both STT and TTS)
  # STT uses ink-whisper model, TTS uses sonic-3 model
  # The STT key is sent in the X-API-Key handshake header, never in the URL.
  # Get from Cartesia dashboard: https://play.cartesia.ai/
  cartesia_api_key: ""                           # ENV: CARTESIA_API_KEY
  # A vendor account's concurrency limit (Cartesia's plans allow 2 and up) is set in the
  # environment only: WAAV_TTS_ACCOUNT_CONCURRENCY="cartesia=2,elevenlabs=5". Requests over it
  # wait their turn instead of drawing the vendor's 429 (docs/interaction_mode.md).

  # OpenAI API key (used for STT, TTS, and Realtime Audio-to-Audio)
  # STT: Whisper models (whisper-1, gpt-4o-transcribe, gpt-4o-mini-transcribe)
  # TTS: TTS models (tts-1, tts-1-hd, gpt-4o-mini-tts)
  # Realtime: Full-duplex audio-to-audio (gpt-4o-realtime-preview)
  # Get from OpenAI dashboard: https://platform.openai.com/api-keys
  openai_api_key: ""                             # ENV: OPENAI_API_KEY

  # AssemblyAI API key (used for STT)
  # Streaming API v3 with real-time transcription
  # Get from AssemblyAI dashboard: https://www.assemblyai.com/app
  assemblyai_api_key: ""                         # ENV: ASSEMBLYAI_API_KEY

  # Hume AI API key (used for TTS and Realtime Audio-to-Audio)
  # TTS: Octave with natural language emotion control and voice cloning
  # Realtime: EVI (Empathic Voice Interface) with 48-dimension emotion analysis
  # Get from Hume dashboard: https://beta.hume.ai/
  hume_api_key: ""                               # ENV: HUME_API_KEY

  # Murf.ai API key (used for TTS)
  # TTS: HTTP streaming with ultra-low latency (~130ms TTFA for Falcon model)
  # Models: Falcon (real-time, low latency), Gen2 (studio quality with pitch/rate/style)
  # 150+ voices across 35+ languages, 20+ speaking styles
  # 12 regional endpoints for data residency and latency optimization
  # Get from Murf dashboard: https://murf.ai/api/docs
  # Environment only: set MURF_API_KEY. The provider reads it itself; this file has no
  # `murf_api_key` key (one would be reported as unknown and ignored).

  # WellSaid Labs API key (used for TTS)
  # TTS: HTTP streaming with premium AI voices, 10x faster than real-time
  # Models: Legacy (20+ languages), Caruso (English only, AI Director pitch/tempo/loudness)
  # 200+ voice avatars across multiple styles (Narration, Promo, Conversational)
  # SOC2 certified, GDPR compliant, EU AI Act-ready
  # Get from WellSaid dashboard: https://wellsaid.io
  # Environment only: set WELLSAID_API_KEY. The provider reads it itself; this file has no
  # `wellsaid_api_key` key (one would be reported as unknown and ignored).

  # Resemble AI API key (used for TTS)
  # TTS: HTTP streaming with voice cloning and 149+ languages
  # Models: Chatterbox (standard), Chatterbox-Turbo (low-latency 75ms), Chatterbox-Multilingual
  # Features: Voice cloning (10s rapid, 10min professional), Speech-to-Speech, Deepfake detection
  # Supports paralinguistic tags [cough], [laugh] with Turbo model
  # Get from Resemble AI dashboard: https://app.resemble.ai
  # Environment only: set RESEMBLE_API_KEY. The provider reads it itself; this file has no
  # `resemble_api_key` key (one would be reported as unknown and ignored).

  # Speechify API key (used for TTS)
  # TTS: HTTP streaming with 50+ languages and 1000+ voices
  # Models: simba-english (English), simba-turbo (low-latency with emotion), simba-multilingual (50+ languages)
  # Features: Voice cloning from 10-30s audio, SSML support, loudness normalization
  # Pricing: $10/1M characters, 50K free tier
  # Get from Speechify console: https://console.sws.speechify.com
  # Environment only: set SPEECHIFY_API_KEY. The provider reads it itself; this file has no
  # `speechify_api_key` key (one would be reported as unknown and ignored).

  # Unreal Speech API key (used for TTS)
  # TTS: HTTP streaming with ultra-low latency (~300ms TTFA)
  # Models: V8 Kokoro (48 voices, 8 languages) and Legacy (5 English voices)
  # Features: Speed control (-1.0 to 1.0), Pitch control (0.5 to 1.5), Bitrate (16k-320k)
  # Pricing: Free tier (250K chars/mo), $49-$4999/mo paid plans, 11x cheaper than ElevenLabs
  # Get from Unreal Speech dashboard: https://unrealspeech.com
  # Environment only: set UNREALSPEECH_API_KEY. The provider reads it itself; this file has no
  # `unrealspeech_api_key` key (one would be reported as unknown and ignored).

  # Speechmatics API key (used for STT and TTS)
  # STT: Real-time WebSocket streaming with 55+ languages
  # TTS: HTTP streaming with expressive voice generation
  # Features: Standard/Enhanced accuracy, diarization, custom vocab, entity recognition
  # Regions: EU (eu.rt.speechmatics.com), US (us.rt.speechmatics.com)
  # Get from Speechmatics Portal: https://portal.speechmatics.com
  speechmatics_api_key: ""                       # ENV: SPEECHMATICS_API_KEY

  # AWS credentials for Amazon Transcribe (STT) and Amazon Polly (TTS)
  # Uses AWS SDK credential chain:
  # 1. These explicit credentials (if provided)
  # 2. Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
  # 3. AWS credentials file (~/.aws/credentials)
  # 4. IAM role (when running on EC2/ECS/Lambda)
  # Get from AWS IAM console or use IAM roles for production
  aws_access_key_id: ""                          # ENV: AWS_ACCESS_KEY_ID
  aws_secret_access_key: ""                      # ENV: AWS_SECRET_ACCESS_KEY
  aws_region: "us-east-1"                        # ENV: AWS_REGION (default: us-east-1)

# STT Provider Configuration (optional - can also be set via WebSocket config)
# stt:
#   provider: deepgram  # Options: "deepgram", "google", "elevenlabs", "microsoft-azure", "cartesia", "openai", "assemblyai", "aws-transcribe", "speechmatics"
#   # Google-specific settings (only used when provider is "google")
#   google:
#     location: global           # Options: global, us, eu, asia-southeast1, etc.
#     recognizer_id: ""          # Optional: pre-configured recognizer ID
#     model: latest_long         # Options: latest_long, latest_short, chirp_2, telephony
#   # AssemblyAI-specific settings (only used when provider is "assemblyai")
#   assemblyai:
#     speech_model: best        # Options: best, nano
#     region: us                # Options: us, eu
#     end_of_turn_confidence: 0.8  # Threshold for turn detection (0.0-1.0)
#     sample_rate: 16000        # Options: 8000, 16000 (recommended)
#   # AWS Transcribe-specific settings (only used when provider is "aws-transcribe")
#   aws_transcribe:
#     language: en-US           # Options: en-US, en-GB, es-US, fr-FR, de-DE, ja-JP, etc. (100+ languages)
#     media_encoding: pcm       # Options: pcm, ogg-opus, flac
#     sample_rate: 16000        # Options: 8000, 16000, 32000, 48000
#     enable_partial_results: true      # Receive interim transcripts
#     show_speaker_labels: false        # Enable speaker diarization
#     vocabulary_filter_method: remove  # Options: remove, mask, tag (for profanity filtering)
#   # Speechmatics-specific settings (only used when provider is "speechmatics")
#   speechmatics:
#     region: eu                # Options: eu, us
#     language: en              # 55+ languages: en, es, fr, de, it, ja, ko, zh, etc.
#     operating_point: standard # Options: standard, enhanced (enhanced = higher accuracy, more cost)
#     max_delay: 2.0            # Maximum delay in seconds (0.5-10.0)
#     enable_partials: true     # Enable partial transcripts
#     enable_diarization: false # Enable speaker diarization
#     max_speakers: 5           # Maximum speakers for diarization (2-25)
#     sample_rate: 16000        # Options: 8000, 16000, 32000, 44100, 48000

# TTS Provider Configuration (optional - can also be set via WebSocket config)
# tts:
#   provider: elevenlabs  # Options: "deepgram", "elevenlabs", "google", "azure", "cartesia", "openai", "aws-polly", "hume", "murf", "wellsaid", "resemble", "speechify", "unrealspeech", "speechmatics"
#   # Cartesia-specific settings (only used when provider is "cartesia")
#   cartesia:
#     model: sonic-3           # Options: sonic-3, sonic-3-2025-10-27
#     voice_id: ""             # Voice UUID from Cartesia voice library
#     audio_format: linear16   # Options: linear16/pcm, wav, mp3
#     sample_rate: 24000       # Options: 8000, 16000, 22050, 24000, 44100, 48000
#   # AWS Polly-specific settings (only used when provider is "aws-polly")
#   aws_polly:
#     voice: Joanna            # Options: Joanna, Matthew, Amy, Emma, Brian, Nicole, etc. (60+ voices)
#     engine: neural           # Options: standard, neural, long-form, generative
#     output_format: pcm       # Options: pcm, mp3, ogg_vorbis
#     sample_rate: 16000       # PCM: 8000, 16000 | MP3/OGG: 8000, 16000, 22050, 24000
#     text_type: text          # Options: text, ssml
#
#   # Murf.ai-specific settings (only used when provider is "murf")
#   # Requires MURF_API_KEY environment variable
#   murf:
#     voice: en-US-natalie         # Voice ID (e.g., en-US-natalie, en-UK-hazel, hi-IN-sunita)
#     model: falcon                # Options: falcon (~130ms TTFA), gen2 (studio quality)
#     audio_format: pcm            # Options: wav, mp3, flac, pcm, ogg, alaw, ulaw
#     sample_rate: 24000           # Options: 8000, 24000, 44100, 48000
#     channel_type: mono           # Options: mono, stereo
#     region: global               # Options: global, us-east, us-west, eu, uk, india, japan, australia, canada, south-korea, uae, brazil
#     # Gen2-only parameters (ignored for falcon model):
#     # rate: 0                    # Speech rate adjustment (-50 to +50)
#     # pitch: 0                   # Pitch adjustment (-50 to +50)
#     # style: null                # Speaking style (e.g., "Conversational", "Newscast")
#     # variation: 1               # Output variation (0-5)
#     # include_audio_duration: false  # Include duration in response
#
#   # WellSaid Labs-specific settings (only used when provider is "wellsaid")
#   # Requires WELLSAID_API_KEY environment variable
#   wellsaid:
#     voice: "3"                   # Speaker ID (e.g., 3 = Alana B., 26 = Wade C.)
#     model: legacy                # Options: legacy (20+ languages), caruso (English only, AI Director)
#     # Caruso-only AI Director parameters (ignored for legacy model):
#     # Use XML tags in text for fine-grained control:
#     # <tempo value="0.5">Slower text</tempo>     # Range: 0.5-2.5
#     # <loudness value="-10">Softer text</loudness>  # Range: -20 to 10
#     # <pitch value="-200">Deeper text</pitch>    # Range: -250 to 500
#     # <respell value="tuh-may-toe">tomato</respell>
#
#   # Resemble AI-specific settings (only used when provider is "resemble")
#   # Requires RESEMBLE_API_KEY environment variable
#   resemble:
#     voice_uuid: ""               # Voice UUID from Resemble AI voices API
#     model: chatterbox            # Options: chatterbox, chatterbox-turbo (75ms latency), chatterbox-multilingual
#     precision: PCM_32            # Options: PCM_32 (highest), PCM_24, PCM_16, MULAW (telephony)
#     sample_rate: 22050           # Options: 8000, 16000, 22050, 32000, 44100, 48000
#     output_format: wav           # Options: wav, mp3
#     use_hd: false                # Enable HD synthesis (higher quality)
#     # Paralinguistic tags (Turbo model only):
#     # [cough], [laugh], [chuckle], [sigh], [gasp] in text
#
#   # Speechify-specific settings (only used when provider is "speechify")
#   # Requires SPEECHIFY_API_KEY environment variable
#   speechify:
#     voice_id: george             # Voice ID (e.g., george, henry, kristy, or custom cloned voice ID)
#     model: simba-english         # Options: simba-english (default), simba-turbo (low-latency), simba-multilingual
#     audio_format: wav_48000      # Options: wav_48000 (default), mp3_24000, ogg_24000, aac_24000
#     language: en-US              # ISO 639-1 locale (auto-detected if not set)
#     loudness_normalization: false  # Normalize to -14 LUFS (increases latency)
#     text_normalization: false    # Convert numbers/dates to words
#
#   # Unreal Speech-specific settings (only used when provider is "unrealspeech")
#   # Requires UNREALSPEECH_API_KEY environment variable
#   unrealspeech:
#     voice_id: Scarlett           # Voice ID - Standard: Scarlett, Dan, Will, Liv, Amy; Kokoro: af_bella, am_adam, etc.
#     bitrate: 192k                # Options: 16k, 32k, 64k, 128k, 192k (default), 256k, 320k
#     speed: 0                     # Speech speed: -1.0 (slow) to 1.0 (fast), 0 = normal
#     pitch: 1.0                   # Voice pitch: 0.5 (low) to 1.5 (high), 1.0 = normal
#     codec: libmp3lame            # Options: libmp3lame (MP3), pcm_mulaw (telephony)
#     # Note: Max text length 1000 chars for /stream endpoint (real-time)
#     # For longer text, use /speech (3000 chars) or /synthesisTasks (500K chars)

# LiveKit recording configuration (S3)
recording:
  s3_bucket: "my-recordings"              # ENV: RECORDING_S3_BUCKET
  s3_region: "us-west-2"                  # ENV: RECORDING_S3_REGION
  s3_prefix: "recordings/production"      # ENV: RECORDING_S3_PREFIX
  s3_endpoint: "https://s3.amazonaws.com" # ENV: RECORDING_S3_ENDPOINT
  s3_access_key: "your-access-key"        # ENV: RECORDING_S3_ACCESS_KEY
  s3_secret_key: "your-secret-key"        # ENV: RECORDING_S3_SECRET_KEY

# Cache configuration
cache:
  path: "/var/cache/waav-gateway"  # ENV: CACHE_PATH (if omitted, uses in-memory cache)
  ttl_seconds: 2592000      # ENV: CACHE_TTL_SECONDS (default: 30 days)

# Authentication configuration
auth:
  required: false                             # ENV: AUTH_REQUIRED (true/false/1/0/yes/no)
  # Leave service_url + signing_key_path BLANK unless you actually enable JWT auth.
  # (Non-existent placeholder paths previously caused a fatal startup error even with
  #  required: false, which broke the quickstart.) Set BOTH together to enable JWT auth.
  service_url: ""                             # ENV: AUTH_SERVICE_URL  e.g. https://auth.example.com
  signing_key_path: ""                        # ENV: AUTH_SIGNING_KEY_PATH  e.g. /etc/waav/key.pem
  # ENV: AUTH_API_SECRETS_JSON (JSON array of {id, secret})
  api_secrets:
    - id: "default"
      secret: "sk_test_default_123456"        # ENV: AUTH_API_SECRETS_JSON (preferred)
    - id: "partner-1"
      secret: "sk_test_partner_abcdef"        # ENV: AUTH_API_SECRETS_JSON (preferred)
  # Legacy single-secret alias (ignored when api_secrets is non-empty):
  # api_secret: "sk_test_legacy_123456"       # ENV: AUTH_API_SECRET (AUTH_API_SECRET_ID optional)
  timeout_seconds: 5                          # ENV: AUTH_TIMEOUT_SECONDS
  # Query-string credentials (`?token=`) are env-only: AUTH_QUERY_TOKEN=allow (default) or deny.

# SIP configuration (optional)
# Used for SIP trunk integration and webhook forwarding
sip:
  room_prefix: "sip-"                         # ENV: SIP_ROOM_PREFIX
  # Naming prefix for SIP trunk and dispatch resources in LiveKit (defaults to "waav")
  # Format: {naming_prefix}-{room_prefix}-trunk and {naming_prefix}-{room_prefix}-dispatch
  naming_prefix: "waav"                       # ENV: SIP_NAMING_PREFIX
  allowed_addresses:                          # ENV: SIP_ALLOWED_ADDRESSES (comma-separated)
    - "192.168.1.0/24"
    - "10.0.0.1"

  # REQUIRED if hooks are configured: Global signing secret for webhook authentication
  # All outbound SIP webhooks are signed with HMAC-SHA256 for security
  # Generate with: openssl rand -hex 32
  # See docs/livekit_webhook.md#webhook-signing for details
  hook_secret: "your-global-signing-secret"   # ENV: SIP_HOOK_SECRET (min 16 chars, 32+ recommended)

  # Downstream webhook endpoints for SIP event forwarding
  # Each hook receives participant_joined events for matching SIP domains
  # All requests include X-WaaV Gateway-Signature header for verification
  #
  # Runtime management: Hooks can be added/replaced at runtime via the
  # POST /sip/hooks REST endpoint. Runtime changes are persisted to
  # <cache_path>/sip_hooks.json and merged with this config on startup.
  # Note: Runtime hooks use the global hook_secret (per-hook secrets not supported via API)
  hooks:                                      # ENV: SIP_HOOKS_JSON (JSON array with optional "secret" field)
    - host: "example.com"                     # SIP domain to match (case-insensitive)
      url: "https://webhook.example.com/events"  # HTTPS strongly recommended
      # Optional: per-hook secret override (omit to use global hook_secret)
      # Use for multi-tenant deployments or zero-trust architectures

    - host: "another.com"
      url: "https://webhook2.example.com/events"

# DAG timeout configuration (optional, requires dag-routing feature)
# Configures timeout values for DAG pipeline execution
# These timeouts control how long each operation type waits before timing out
# Useful for tuning performance in different network conditions or for
# different provider latency profiles
#
# Note: These settings only apply when the dag-routing feature is enabled
# For normal STT/TTS operations, provider-specific timeouts are used instead
dag_timeouts:
  # Default node execution timeout in seconds
  node_execution_secs: 30        # ENV: DAG_NODE_EXECUTION_SECS
  # Provider operation timeout in seconds
  provider_operation_secs: 30    # ENV: DAG_PROVIDER_OPERATION_SECS
  # STT endpoint timeout in seconds (longer for audio processing)
  stt_endpoint_secs: 60          # ENV: DAG_STT_ENDPOINT_SECS
  # TTS endpoint timeout in seconds (longer for audio generation)
  tts_endpoint_secs: 60          # ENV: DAG_TTS_ENDPOINT_SECS
  # LLM endpoint timeout in seconds (longest due to generation time)
  llm_endpoint_secs: 120         # ENV: DAG_LLM_ENDPOINT_SECS
  # WebSocket operation timeout in seconds
  websocket_operation_secs: 30   # ENV: DAG_WEBSOCKET_OPERATION_SECS

# Interaction mode (optional, off by default)
# A /ws session that sends `"interaction": true` (or an object of settings) in its config
# message then gets the duplex agent: it keeps the floor, acknowledges, runs the request as a
# background task on the session's LLM and relays the answer. The session needs a
# conversation_config (or interaction.tasks.llm), or it is a Bud voice-agent session, whose
# agent then does the tasks (see agent_default). With the switch off, or on a session it does
# not fit, the session runs as before and a config_warning says why. The mode speaks English:
# a session whose stt_config.language is not English runs without it. A session with a
# `livekit` block runs it on the room's audio (a SIP call is a participant of such a room) and
# its events are also published in the room, on the data topic `waav.interaction`. A session
# with a dag_config runs it when the graph ends in text (a text_output node and no node that
# produces audio): the graph then does the tasks. A voice-agent session on
# /v1/realtime?model=prompt:<agent> runs it like one on /ws, with the events as `bud.*` events.
#
# interaction:
#   enabled: true                             # ENV: WAAV_INTERACTION_ENABLED
#   # The block of a session that sends none, and the base of every session's own block
#   # (JSON `true` or an object). With it set, every /ws session that fits runs the mode.
#   default:                                  # ENV: WAAV_INTERACTION_DEFAULT (JSON)
#     # A packaged persona's id, or the persona itself as an object (persona.schema.json),
#     # checked like the packaged ones. A session may only name one.
#     front:
#       persona: "default"
#     # Conversation controls (docs/interaction_mode.md, "Conversation Controls"): the front
#     # model reads "slower please", "say that again", "stop talking", "talk to me in Spanish"
#     # in context; the orchestrator's conversation_control tool and the client's `control`
#     # message give the same controls. The operator's bounds; a session cannot set them.
#     controls:
#       allowed: [stop, hold, resume, repeat, not_heard, clarify, spell, rate, volume,
#                 verbosity, language, voice, backchannels, updates, to_screen, end, human]
#       rate: [0.7, 1.3]                        # speaking-rate bounds, steps of 0.15
#       volume_db: [-9, 9]                      # playback gain bounds, steps of 3 dB
#       languages: []                           # e.g. [es]: switchable where the recogniser
#                                               # hears it (a multilingual model, or a second
#                                               # one opened in it) and the provider has a voice;
#                                               # the front model is shown them by code and name
#       from_agents: true                       # the orchestrator may issue controls
#       from_clients: true                      # the client app may
#       answers_only: false                     # switch without a reviewed pack: partial
#       # "Let me talk to a person": a room's SIP caller is referred to transfer_to (the SIP
#       # leg's transfer); any other session sends `human_requested` to the client and the
#       # same, signed with tool_secret, to url (with a task_id and its callback route). The
#       # operator answers human_connected (the transfer line, then the session ends) or
#       # human_unavailable, in its reply or on the callback route, within wait_s; none, or
#       # unavailable: an honest line and the call goes on. Neither set: an honest line.
#       human:
#         transfer_to: null                     # e.g. "+15551230000"
#         url: null                             # e.g. "https://ops.example.com/handoff"
#         wait_s: 60                            # 0-600; 0: hand over at once, no callback
#     # When a service fails (docs/interaction_mode.md, "When Services Fail"): pre-made lines
#     # in the session's voice ("Sorry, my systems are acting up..."), at most 3 stalls 8 s
#     # apart, then the exit line, `session_failed` and the signed push. `lines` and
#     # `follow_up` are the operator's; a session may set the two times. A speech-to-speech
#     # session (/realtime, a room's realtime voice) plays the server's default set
#     # (failure_voice below) when its provider fails, stalls or is lost.
#     failure:
#       stall_after_ms: 2500                    # no first token (any background: LLM, agent, DAG,
#                                               # backend) / no audio / no provider answer: a stall
#       max_wait_s: 30                          # still down this long after the first stall: exit
#       follow_up: false                        # your system calls back: the exit line promises it
#       lines: {}                               # e.g. {"exit": "...please call us back later."}
#     # The agent's own voice coming back on the caller's line. The gate keeps it from
#     # interrupting the agent. The canceller removes it, also from what the speech-to-text
#     # hears: "auto" turns it on for a caller on a phone line (a room's SIP participant, a
#     # client with phone_line: true or 8 kHz audio), for a client with client_aec: false,
#     # and after auto_enable_after_echo_episodes stretches of echo within 30 s; "on" is for
#     # clients that play the agent aloud and cancel no echo.
#     # Listening sounds ("mhm") while the caller tells a long story: "auto" is on except
#     # for a caller on a phone line; intensity lowers the persona's (low: one a turn).
#     # A pause the turn-end model is sure is not the end (under 0.05, or under 0.7 on a
#     # dangling "and"/"to"/"the") is held (nothing is said, no task starts) up to 800 ms
#     # after the speech-to-text's final; it has no setting.
#     duplex:
#       echo:
#         correlation_gate: true
#         aec: "auto"                           # "auto" | "on" | "off"
#         client_aec: null                      # the client cancels echo itself: true | false
#         phone_line: null                      # the client's caller is on a phone line
#         tail_ms: 2000                         # 0 to 5000: words this long after echo are its
#         max_bulk_delay_ms: 1000               # 200 to 1500: the latest echo that is found
#         auto_enable_after_echo_episodes: 2    # 0 (never) to 10
#       backchannel:
#         enabled: "auto"                       # "auto" | true | false
#         intensity: "medium"                   # "off" | "low" | "medium" | "high"
#         # The pack's gap_ms counts from the last listening sound and from the end of the
#         # agent's last line (a caller who has just said "wait a second" hears none).
#     # What is known about the caller. pace also sets the speaking rate (15% slower or
#     # faster) on the openai and deepgram text-to-speech; it may change mid-session.
#     #   front: { caller: { verbosity: "brief", pace: "slower" } }
#     # Where a question may be answered: with "client" the client shows forms, sign-in
#     # links and sensitive values (a card number) on a screen; without it they are declined.
#     # With "dtmf" a caller on a phone line (a SIP participant of a LiveKit room) confirms
#     # with keys 1 and 2, picks a choice's option by its number, and types a sensitive value
#     # on the keypad, ending it with # or a pause of policy.hitl_key_gap_ms (5000); a room's
#     # recording is stopped while it is typed and started again as <stream_id>-part2.
#     hitl:
#       channels: ["voice", "client"]           # add "dtmf" for phone lines
#     # Tasks after the call. session_end auto: a task that may change something, or whose
#     # result has a reader (push_url, or the caller of a lost connection for the grace), runs
#     # on for at most orphan_max_s; any other is cancelled. cancel_all stops every task but a
#     # tool call already on the wire; continue_all lets every live task run on. After a lost
#     # connection the caller has reconnect_grace_s to come back for the result (a new session
#     # with the same stream_id); when nobody did, or the client closed the session itself,
#     # the result is posted to push_url, signed with tool_secret like a tool call. Only this
#     # file, an alias and an agent entry can set push_url, session_end and orphan_max_s.
#     tasks:
#       reconnect_grace_s: 60                   # 0 to 600
#       push_url: "https://hooks.example.com/waav/tasks"
#       session_end: auto                       # auto | cancel_all | continue_all
#       orphan_max_s: 1800                      # 0 to 86400
#       # No limit on work by default. Beyond a limit a request waits in a queue (never
#       # refused) and the caller hears it is queued. A session may lower max_live; only
#       # this file, an alias and an agent entry set max_live_tenant (this process's
#       # sessions of one tenant). Children of an orchestrator count against their entry's
#       # max_concurrent instead.
#       limits:
#         max_live: 8                           # 1 to 10000
#         max_live_tenant: 200
#       # An orchestrator: a large model on the LLM tier whose tools are these entries of
#       # task_backends (below). Calling one starts a child task and returns at once; the
#       # child's result comes back to the orchestrator as a later message. A model name runs
#       # on the session's own LLM; an object of the tasks.llm shape is an LLM of its own
#       # (max_tokens 4096 unless set). Its system_prompt should say what the agents know
#       # and that they ask the caller themselves, or a model may ask for every detail first.
#       orchestrator: { base_url: "http://127.0.0.1:18790/v1", model: "gpt-oss-20b",
#                       system_prompt: "You hand the caller's requests to agents; they know the caller's account and ask for anything else themselves." }
#       agents: ["browser", "coder"]
#       # How a child's result reaches the caller while the conversation goes on. It is
#       # published at once (task_output, GET /v1/tasks/events) and spoken only at a slot:
#       # the agent's answer is over and the caller is not speaking; after 4 s of silence it
#       # is said. ask: one short offer at the end of the answer ("want it now?"); tell: the
#       # update itself; screen: never spoken unless asked. The front words each update
#       # (at most 20 words, within 1.2 s, checked against the result); without such a line
#       # it waits for the next slot (there is no template).
#       # It may change mid-session: interaction_update {"tasks": {"announce": "screen"}}.
#       announce: ask                           # ask | tell | screen
#       # A finished task's agent keeps its context for follow-ups this long ("can it be a
#       # window seat?" goes to the same agent with its A2A contextId, webhook task_id, MCP
#       # task id or Responses response id); later, the new task carries a line of the old
#       # result instead. A question the stored result answers is answered from it.
#       follow_up_ttl_s: 1800                   # 0-86400
#       # resume_key: a caller's own key (8-128 of A-Z a-z 0-9 - _ . :): a caller who calls
#       # back with it on another stream_id gets the tasks' outcomes and pending updates.
#       # Accepted from a session only with allow_resume_key (below).
#   # The block of a Bud voice-agent session (`config.agent`) whose agent entry carries no
#   # `interaction` block of its own; the entry's block wins. Such a session never takes
#   # `default` as its block. `background.answer_marker` names the line an agent is known to
#   # write before its final answer: its answer is then spoken sentence by sentence as it is
#   # written. Without a marker the answer is spoken when the agent's run completes.
#   agent_default:                            # ENV: WAAV_INTERACTION_AGENT_DEFAULT (JSON)
#     background:
#       answer_marker: "ANSWER:"
#   # Speech-to-speech providers (/realtime, the /v1/realtime relay, and a /ws LiveKit room
#   # whose session sets interaction.speech.realtime) keep their own voice: the gateway
#   # monitors what they say and cannot prevent it. Interaction mode runs on one only when it
#   # is listed here, as "provider" or "provider:model". A room's realtime voice also needs
#   # the provider's key (for example openai_api_key) and the livekit settings.
#   truth_ack: ["openai"]                     # ENV: WAAV_INTERACTION_TRUTH_ACK (comma-separated)
#   # The half-cascade needs no listing: a session with speech.voice_owner: "gateway" on an
#   # OpenAI-family provider (/realtime, a room, or the /v1/realtime relay through
#   # realtime_default below) has the provider write its replies and the gateway check and say
#   # each sentence in its own voice: the session's speech.voice (a tts_config object), else
#   # failure_voice below. On the relay each such line reaches the client as a response of the
#   # gateway's own (metadata bud_source "gateway", bud_kind "voice").
#   # The block of every /v1/realtime relay session (Bud realtime deployments whose vendor
#   # speaks OpenAI Realtime). It needs a background: tasks.llm or tasks.default_backend.
#   realtime_default:                         # ENV: WAAV_INTERACTION_REALTIME_DEFAULT (JSON)
#     regime: "delegating"
#     speech:
#       claim_policy: "correct"
#     tasks:
#       llm: { base_url: "https://llm.example.com/v1", model: "your-model" }
#   # A llama-server that words the acknowledgements and reads what the caller meant (every
#   # turn, an answer, a stop, another language). Interaction mode needs it: without a ready
#   # one a session runs without the mode, a speech-to-speech one too (there it reads the
#   # caller's answer to the gateway's question, a cancel and a continuer). With `command` the gateway runs it itself: it starts it, polls
#   # <url>/health, restarts it with backoff when it exits or stops answering, and stops it
#   # at shutdown; the sessions use it while it is ready. A model file named *lfm* needs
#   # `licence` (lfm_open_eligible | liquid_commercial) and a LICENSE file beside it.
#   front_model:
#     url: "http://127.0.0.1:18741"           # ENV: WAAV_INTERACTION_FRONT_URL
#     model: "qwen1.5b"                       # ENV: WAAV_INTERACTION_FRONT_MODEL
#     # Two slots (-np 2): the gateway keeps the second for its decisions about the caller's
#     # words over the agent and primes it at each agent line (read from GET /props).
#     command: ["/opt/llama/llama-server", "-m", "/models/front.gguf", "--port", "18741",
#               "-np", "2", "-c", "8192"]
#                                             # ENV: WAAV_INTERACTION_FRONT_COMMAND (space-separated)
#     # With url "unix:" the gateway runs the command on a private UNIX socket instead: a
#     # per-boot run directory $WAAV_RUN_DIR/front-<boot>/ (0700; default <temp dir>/waav-run)
#     # with a fresh key file (0600), "--host <dir>/front.sock --api-key-file <dir>/front.key"
#     # added to the command; children an earlier gateway left running are stopped at start.
#     # The model is ready once /health is 200 and one canary decision came back. No GPU-to-
#     # CPU fallback.
#     licence: "lfm_open_eligible"            # ENV: WAAV_FRONT_LICENCE
#     # (also checked against an operator-run server's GET /props: LFM weights need it)
#   # Signs the HTTP calls of the tools in `default` above (X-WaaV-Signature: HMAC-SHA256 of
#   # "<timestamp>.<body>"). A tool a session declares itself is never signed.
#   tool_secret: "your-tool-signing-secret"   # ENV: WAAV_INTERACTION_TOOL_SECRET
#   # Accept `interaction.tasks.tools` from a session (never under the Bud control plane)
#   allow_client_tools: false                 # ENV: WAAV_INTERACTION_ALLOW_CLIENT_TOOLS
#   # A Redis the gateway processes of one deployment share for their tasks: GET /v1/tasks
#   # then answers for every process, a caller who comes back on another process gets the
#   # result there, and the tasks a dead process left running are marked (state "unknown"
#   # where a call may have been on the wire): a process whose 30 s lease has run out is
#   # swept 15 s later if it has not renewed it; one that was only cut off re-asserts its
#   # tasks when it is back. Tenant personas are kept there too (each PUT is atomic).
#   # GET /v1/tasks/events on any process streams every process's task events (pub/sub), and
#   # a backend's callback (a webhook's, an A2A push, the answer to a controls.human.url
#   # hand-off) that reaches the wrong process is handed to the one that runs the task (which
#   # checks its signature or token; a push's token crosses the Redis only as its SHA-256).
#   # Without it tasks are kept in each process.
#   # Not WAAV_REDIS_URL, which is the Bud control plane's.
#   task_redis_url: "redis://127.0.0.1:6379/3"  # ENV: WAAV_TASK_REDIS_URL
#   # Backgrounds other than an LLM of the session's: a session names one of these with
#   # `interaction.tasks.default_backend` and its tasks run there. The address and the secret
#   # stay here; a session never sends either. `secret_env` (also `bearer_env`, `api_key_env`)
#   # names the environment variable that holds the secret. `side_effects: "none"` says a task
#   # changes nothing outside the backend ("possible" is the default).
#   task_backends:                            # ENV: WAAV_INTERACTION_TASK_BACKENDS (JSON list)
#     # A webhook: each task is POSTed to it, signed like a tool call with its secret (or
#     # tool_secret); it answers, or reports later on POST /v1/tasks/{task_id}/callback.
#     - name: "crm"
#       type: "webhook"
#       url: "https://crm.example.com/waav/tasks"
#       secret_env: "CRM_WEBHOOK_SECRET"
#     # As an orchestrator's agent: what it reads to choose the entry, how many tasks of a
#     # session run on it at once (no limit when not set), how long a task may take (600 s),
#     # how long the caller has to answer its question (at most hitl_answer_timeout_ms; a
#     # question's own expires_in_ms wins; either is the job's deadline, and a question that
#     # cannot wait for the end of the agent's answer breaks into it at a clause boundary),
#     # and the entry that takes new tasks while this one keeps failing (its breaker opens
#     # after 3 failed tasks, for 30 s). A task that changes nothing is tried once more when
#     # the backend did not answer.
#     - name: "browser"
#       type: "a2a"
#       url: "https://agents.example.com/browser"
#       bearer_env: "BROWSER_AGENT_TOKEN"
#       description: "Operates websites in a browser: bookings, forms, purchases."
#       max_concurrent: 4
#       timeout_s: 300
#       question_deadline_ms: 5000
#       fallback: "concierge"
#     # An Agent2Agent 1.0 agent. Its Agent Card (<url>/.well-known/agent-card.json, read at
#     # the start of a session that uses it, as an orchestrator's agent or its default_backend,
#     # and kept catalog_ttl_s, 300 s) describes it when the entry has no description, names
#     # its binding (JSON-RPC, else HTTP+JSON, else gRPC, on the entry's origin; gRPC on its
#     # host), says whether it streams (SendStreamingMessage) and in which header the secret
#     # goes. `oauth` (client_id, client_secret_env, optional scope; token_url optional: the
#     # card's OAuth 2.0 client-credentials scheme names it when it is https or on the entry's
