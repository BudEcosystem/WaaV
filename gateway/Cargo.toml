[package]
name = "waav-gateway"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
keywords = ["voice", "stt", "tts", "livekit", "speech", "ai-gateway"]
categories = ["multimedia::audio", "web-programming"]
description = "WaaV AI Gateway - Real-time voice processing server with unified STT and TTS services"
publish = false

# Clippy policy: CI gates with `-D warnings`, which would otherwise block on a large PRE-EXISTING
# backlog of purely-stylistic/pedantic lints (mostly in tests and config builders). These are
# allowed crate-wide and individually so the gate stays meaningful for the bug-class lints
# (clippy::correctness / suspicious — which remain at the default deny/warn and are caught). The two
# genuine bug-class findings surfaced during this audit (a dropped error-send future in cartesia,
# duplicate if/else branches in bhashini) were FIXED rather than allowed.
[lints.clippy]
field_reassign_with_default = "allow"   # build-default-then-reassign, pervasive in tests/builders
should_implement_trait = "allow"        # intentional inherent `from_str` returning Option/Self
doc_lazy_continuation = "allow"         # doc-comment markdown continuation formatting
assertions_on_constants = "allow"       # assert!(true) module-compiles smoke tests
manual_checked_ops = "allow"
needless_range_loop = "allow"
result_large_err = "allow"              # large STT/TTS error enums (refactor signal, not a bug)
too_many_arguments = "allow"
unnecessary_sort_by = "allow"
unnecessary_cast = "allow"
ptr_arg = "allow"
type_complexity = "allow"
new_ret_no_self = "allow"               # builder-style `new` returning a related type
inconsistent_digit_grouping = "allow"
derivable_impls = "allow"
unnecessary_get_then_check = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"

[lints.rust]
# `dead_code` fires on benign test-scaffolding helpers (mock callbacks kept for symmetry across the
# provider test suites) and feature-gated alternative implementations (e.g. the noise_filter scale
# constants used only on the noise-filter path). Allowed crate-wide so the `-D warnings` CI gate is
# not blocked by them; genuine unused-code review is done via the periodic brutal reviews.
dead_code = "allow"

[features]
default = []
# Opt-in gates for the slow, network/model-dependent integration tests in detector modules
# (declared so `#[cfg(feature = "...")]` references are not `unexpected_cfgs` under -D warnings).
silero-vad-integration-tests = []
smart-turn-integration-tests = []

# =============================================================================
# SIMD Control Features
# =============================================================================
# These features control SIMD behavior for testing and specific deployment scenarios.
# Note: SIMD is always enabled via pulp with automatic CPU detection.
# These flags are primarily for CI/testing purposes.

# simd-native: Use -C target-cpu=native for maximum performance on the build machine
# Useful for local development and benchmarking. Not recommended for distribution.
simd-native = []

# simd-portable: Use portable baseline (AVX2/NEON) for cross-platform distribution
# This is the default behavior set in .cargo/config.toml
simd-portable = []

# simd-scalar-only: Force scalar fallback for testing and comparison benchmarks
# Useful for verifying SIMD correctness and measuring speedup
simd-scalar-only = []

# =============================================================================
# Core Features
# =============================================================================
turn-detect = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
plugins-dynamic = ["dep:libloading", "dep:abi_stable", "dep:waav-plugin-api"]  # Dynamic plugin loading with FFI-safe types
noise-filter = [
    "dep:deep_filter",
    "dep:tract-core",
    "dep:tract-onnx",
    "dep:tract-pulse",
    "dep:tract-hir",
    "dep:ndarray",
    "dep:num_cpus",
]
openapi = [
    "dep:utoipa",
]
dag-routing = ["dep:rhai", "dep:petgraph", "dep:rtrb"]  # DAG-based customizable voice processing pipelines with conditional routing

# Smart Turn: Audio-based semantic turn detection using Whisper encoder
smart-turn = [
    "dep:ort",
    "dep:ndarray",
    "dep:mel_spec",
    "dep:realfft",
    "dep:num",
    "dep:dirs",
]

# Silero VAD: Local neural network voice activity detection
silero-vad = [
    "dep:ort",
    "dep:ndarray",
    "dep:dirs",
]

# Combined ensemble: Both audio-based (smart-turn) and text-based (turn-detect) turn detection
turn-ensemble = ["smart-turn", "turn-detect", "silero-vad"]

[dependencies]
async-trait = "0.1.88"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Server
axum = { version = "0.8.4", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1.46.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors", "set-header"] }

# Rate limiting
governor = "0.8"
tower_governor = "0.8"

# Secrets management
zeroize = { version = "1.7", features = ["derive"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1.8"
# Endian-safe, zero-copy POD slice casting for audio sample (i16) reinterpretation.
# Already present transitively; pinned as a direct dep so the LiveKit audio decode
# can take the aligned fast path without host-endian UB on big-endian targets.
bytemuck = "1.25"
http-body-util = "0.1"

# HTTP client
# Note: Using default-features = false + rustls-tls to avoid OpenSSL dependency
# This is important for cross-compilation to musl targets
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "multipart"] }
hound = "3.5"

# JWT authentication
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }

# WebSocket client
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.0"
base64 = "0.22.0"
http = "1.0"

# TLS support
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Environment variables
dotenvy = "0.15"

# Configuration
serde_yaml = "0.9"

# Error handling
thiserror = "2.0.12"

# Performance optimizations
parking_lot = "0.12"

# Cache dependencies
moka = { version = "0.12", features = ["future"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
arc-swap = "1.7"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Metrics (W-C1 observability): facade + Prometheus text exposition exporter.
# `metrics` is the vendor-neutral recording facade (counters/histograms/gauges);
# `metrics-exporter-prometheus` installs a process-global recorder and renders the
# Prometheus text exposition format served at /metrics.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Text processing
regex = "1.10"
once_cell = "1.19"
uuid = { version = "1.10", features = ["v4"] }

object_store = { version = "0.12", features = ["aws"] }

# OpenAPI documentation (feature-gated)
utoipa = { version = "5.3", optional = true, features = ["axum_extras"] }

# LiveKit
livekit = "=0.7.24"
livekit-api = "=0.4.9"
livekit-protocol = "=0.5.1"
# Need prost/pbjson-types for SIP API client, using same versions as livekit to avoid conflicts
prost = "0.12.6"
pbjson-types = "0.6.0"

deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "f1d19bffbeccd98a616f23c89903a2386a1d1dba", package = "deep_filter", default-features = true, features = ["tract", "default-model-ll"], optional = true }
tract-core = { version = "=0.21.5", optional = true }
tract-onnx = { version = "=0.21.5", optional = true }
tract-pulse = { version = "=0.21.5", optional = true }
tract-hir = { version = "=0.21.5", optional = true }
time = ">=0.3.35"
# Using 0.15.6 to match DeepFilterNet - ort will work with explicit type conversions
ndarray = { version = "0.15.6", optional = true }
num_cpus = { version = "1.17.0", optional = true }

# Turn detection dependencies
ort = { version = "2.0.0-rc.10", features = ["load-dynamic", "download-binaries"], optional = true }
tokenizers = { version = "0.22.1", default-features = false, features = ["onig"], optional = true }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2.6"
anyhow = "1.0"

# Google Cloud STT
# Using google-api-proto 1.678.0 for prost 0.12 compatibility with LiveKit
# (newer versions use prost 0.13 which conflicts with livekit's prost 0.12)
google-api-proto = { version = "=1.678.0", features = ["google-cloud-speech-v2"] }
google-cloud-auth = "1.2.0"
tonic = { version = "0.11", features = ["tls-roots", "prost", "channel"] }
prost-types = "0.12"
async-stream = "0.3"

# AWS SDKs for Amazon Transcribe and Polly
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-transcribestreaming = "1.62"
aws-sdk-polly = "1.61"
# AWS Bedrock Runtime — drives Nova Sonic's `InvokeModelWithBidirectionalStream`
# (HTTP/2 bidi event stream; the same SDK family as transcribestreaming above).
aws-sdk-bedrockruntime = "1.62"
aws-credential-types = "1.2"
aws-types = "1.3"
aws-smithy-types = "1.3"
aws-smithy-runtime-api = "1"
dashmap = "6.1.0"

# Plugin system dependencies
inventory = "0.3"           # Compile-time plugin registration
phf = { version = "0.11", features = ["macros"] }  # O(1) perfect hash lookup
enum_dispatch = "0.3"       # Static dispatch for trait objects (10x faster than dyn)
semver = { version = "1.0", features = ["serde"] }  # Version checking for plugin compatibility
libloading = { version = "0.8", optional = true }  # Dynamic plugin loading (feature-gated)
abi_stable = { version = "0.11", optional = true }  # FFI-safe ABI stability for dynamic plugins
waav-plugin-api = { path = "../plugin-api", optional = true }  # Plugin API types

# DAG routing dependencies
rhai = { version = "1.17", optional = true, features = ["sync"] }  # Scripting engine for DAG expressions
petgraph = { version = "0.6", optional = true }  # Graph data structure for DAG routing
rtrb = { version = "0.3", optional = true }  # Lock-free ring buffer for inter-node communication

# Smart Turn dependencies (audio-based turn detection)
mel_spec = { version = "0.3", optional = true }  # Whisper-compatible mel spectrogram extraction
rubato = { version = "0.16" }  # High-quality audio resampling (C-G5 resampler is core: TTS egress client_playback_rate works in every build)
realfft = { version = "3.4", optional = true }  # FFT for mel spectrogram (fallback)

# Silero VAD dependencies
dirs = { version = "5.0", optional = true }  # Cache directory for model storage

# Smart Turn additional dependencies
num = { version = "0.4", optional = true }  # Complex number support for FFT

# SIMD optimizations - portable SIMD with runtime CPU feature detection
# Used for high-performance audio processing (PCM conversion, mel spectrogram, FFT)
pulp = "0.18"

[dev-dependencies]
aws-smithy-eventstream = "0.60"
tower = { version = "0.5.2", features = ["util"] }
tempfile = "3.8"
serial_test = "3.2"
tokio-test = "0.4"
mockito = "1.2"
wiremock = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "gateway_benchmarks"
harness = false

[[bench]]
name = "simd_benchmarks"
harness = false

# =============================================================================
# Dev Profile: Optimize for lower memory usage during linking
# =============================================================================
[profile.dev]
# Increase codegen units to reduce per-unit memory usage during compilation
# More units = more parallelism but smaller individual compilation jobs
codegen-units = 16
# Split debug info to separate files (reduces linker memory by ~40%)
split-debuginfo = "unpacked"
# Reduce debug info level (0=none, 1=line tables, 2=full)
# Level 1 still gives line numbers in backtraces but uses much less memory
debug = 1
# Incremental compilation (enabled by default, but be explicit)
incremental = true

# Debug profile optimizations to fix tract codegen issues
# Disable debug assertions specifically for problematic dependencies
[profile.dev.package.deep_filter]
debug-assertions = false
[profile.dev.package.tract-core]
debug-assertions = false
[profile.dev.package.tract-onnx]
debug-assertions = false
[profile.dev.package.tract-pulse]
debug-assertions = false
[profile.dev.package.tract-hir]
debug-assertions = false

# Optimize heavy dependencies even in dev mode to reduce their size
[profile.dev.package.webrtc-sys]
opt-level = 2
[profile.dev.package.livekit]
opt-level = 1
[profile.dev.package.rhai]
opt-level = 1

# =============================================================================
# Release profile optimizations for smaller, faster binaries
# =============================================================================
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Multi-tenant isolation (W-E1 / E6): unwind, do NOT abort. Under `panic = "abort"`
# a single panic — e.g. from one malformed WS frame in one session — kills the
# whole process and every other tenant's connection. With unwinding, per-session
# task bodies wrapped in `catch_unwind` (see handlers/ws/handler.rs) contain a
# panic to the one offending session. Cost: slightly larger binary + landing-pad
# overhead; acceptable for a multi-tenant gateway. Use `release-small` (fat LTO)
# if binary size is critical.
panic = "unwind"
# Disable incremental for release (saves disk space, releases are rare)
incremental = false

# =============================================================================
# Size-optimized release profile (use when disk space is critical)
# Usage: cargo build --profile release-small
# =============================================================================
[profile.release-small]
inherits = "release"
opt-level = "z"     # Optimize for size instead of speed
lto = "fat"         # Full LTO for maximum size reduction

# =============================================================================
# Build artifact size management notes:
# - Run: ./scripts/cargo_cleanup.sh sweep   (weekly cleanup)
# - Run: ./scripts/cargo_cleanup.sh status  (check sizes)
# - Incremental builds grow over time; periodic cleanup is essential
# - Target dir >5GB indicates cleanup is needed
# =============================================================================
