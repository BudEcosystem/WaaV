[package]
name = "waav-segmented-stt"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Segmented speech-to-text for live WaaV calls: the capability map and resolver, the segmenting engine, and the transcriber layer that uploads one utterance at a time."
publish = false

[dependencies]
async-trait = "0.1.88"
base64 = "0.22.0"
bytes = "1.8"
futures = "0.3"
http = "1.0"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "multipart"] }
rubato = "0.16"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.46.0", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2.5.0"

[dev-dependencies]
axum = { version = "0.8.4", features = ["ws", "multipart"] }
tokio = { version = "1.46.0", features = ["full", "test-util"] }
