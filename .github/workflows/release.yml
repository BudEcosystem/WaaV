name: Release

# Cut a release of the WaaV gateway: build and publish the image, then create (or update)
# the GitHub Release for the tag.
#
# Three ways in:
#   * publish a Release in the UI  -> the `release` event; this is how releases are actually cut
#   * push a tag `v1.2.3` or `1.2.3` -> the tag event
#   * run this workflow by hand    -> same, against a tag that already exists
# The last is what makes a release UPDATABLE: re-running against an existing tag re-publishes
# the image and rewrites the release body rather than failing on "already exists".
#
# The tag is used VERBATIM (checkout, release) and the version is it without a leading `v`.
# Both spellings are real here: release `v0.1.0` was cut against tag `0.1.0`.
#
# Publishes to registry.bud.studio/runtime/waav, the registry every other Bud service is
# pulled from (pde-ditto's imagePullSecret is `registry.bud.studio`).
#
# Secrets required: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN. The names say dockerhub and the
# registry is Harbor -- that mismatch is inherited from bud-runtime's release workflows,
# where the same two secrets authenticate to registry.bud.studio. Kept identical so one
# credential pair covers both repos.
#
# As of this commit THIS REPOSITORY HAS NO ACTIONS SECRETS AT ALL, so the first run will stop
# at the credentials check until they are added under
# Settings > Secrets and variables > Actions. That is deliberate: the alternative is a build
# that cannot push and a green tick.

on:
  release:
    types: [published]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release, with or without the v (e.g. 1.2.3). Must already exist."
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  IMAGE: registry.bud.studio/runtime/waav

# Publishing a Release in the UI creates the tag AND fires `release`, so one release matches
# two triggers here and starts two runs. They build the same image from the same tag, so the
# later one supersedes the earlier instead of queueing behind it -- `0.1.1` otherwise paid for
# the same Rust build twice.
concurrency:
  group: release-${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + publish image
    # Blacksmith, like every release workflow in bud-runtime. 8 vCPU because this is a Rust
    # build with ONNX in it, not a script.
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 120
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Resolve the tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Precedence: an explicit dispatch input, then the release being published, then the
          # pushed ref. The tag is used AS IT IS -- an earlier version rewrote `0.1.0` to
          # `v0.1.0` and then checked out a ref that does not exist.
          TAG="${INPUT_TAG:-${EVENT_TAG:-$REF_NAME}}"
          VERSION="${TAG#v}"
          # A pre-release must not move :latest. Same rule as the sibling repo's release
          # workflows, so an -rc image cannot become the default pull for a cluster.
          if printf '%s' "$VERSION" | grep -qiE -- '-(rc|alpha|beta|pre|dev|hotfix|snapshot)'; then
            PRERELEASE=true
            TAGS="${IMAGE}:${VERSION}"
            echo "::notice::Pre-release '${VERSION}' — :latest will not be moved."
          else
            PRERELEASE=false
            TAGS="${IMAGE}:${VERSION}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo 'tags<<TAGS_EOF'; printf '%s\n' "$TAGS"; echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "publishing:"; printf '%s\n' "$TAGS" | sed 's/^/     /'

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Compare the tag against the crate version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          CRATE="$(sed -n '1,20{s/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p;}' gateway/Cargo.toml | head -1)"
          if [ "$CRATE" != "$VERSION" ]; then
            # A warning, not a gate: the tag is the release's identity and the crate version
            # is metadata inside it. Worth seeing on every release, not worth blocking one.
            echo "::warning::tag ${VERSION} != gateway/Cargo.toml version ${CRATE}"
          else
            echo "tag matches gateway/Cargo.toml (${CRATE})"
          fi

      - name: Require the registry credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${USERNAME}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set on this repository." >&2
            echo "::error::They authenticate to registry.bud.studio (the names are inherited" >&2
            echo "::error::from bud-runtime, where the same pair is used). Add them under" >&2
            echo "::error::Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to registry.bud.studio
        uses: docker/login-action@v3
        with:
          registry: registry.bud.studio
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Context is the REPO ROOT, not gateway/: the Dockerfile copies the sibling crates
      # (bud-auth, waav-openai-audio, plugin-api) that gateway/Cargo.toml depends on by path.
      # Building from gateway/ fails at `COPY bud-auth /app/bud-auth`.
      # amd64 only. bud-runtime builds arm64 on a native `blacksmith-*-arm` runner and joins
      # the two with `docker buildx imagetools create`; QEMU for a Rust + ONNX build is not a
      # substitute. Mirror that matrix here if an arm64 cluster ever needs this image.
      - name: Build and push
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

      - name: Summarise
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### WaaV ${VERSION}"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| image | \`${IMAGE}:${VERSION}\` |"
            echo "| digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: create or update the release
    needs: image
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.image.outputs.tag }}
          fetch-depth: 0

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.image.outputs.tag }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          # The image block is delimited so a re-run REPLACES it instead of adding another
          # copy. softprops/action-gh-release with append_body did the latter: re-running
          # 0.1.1 left the release carrying three "What's Changed" sections and two image
          # blocks, which is the opposite of what an updatable release should do.
          START='<!-- waav-release-image:start -->'
          END='<!-- waav-release-image:end -->'
          {
            echo "$START"
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "${DIGEST}"
            echo '```'
            echo
            echo "Platform: \`linux/amd64\`."
            echo
            echo "Pull by digest to pin exactly what was tested:"
            echo '```bash'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo '```'
            echo "$END"
          } > image-block.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — updating it"
          else
            echo "release $TAG does not exist — creating it"
            args=(--title "$VERSION" --generate-notes)
            case "$VERSION" in *-*) args+=(--prerelease) ;; esac
            [ "${DRAFT:-false}" = "true" ] && args+=(--draft)
            gh release create "$TAG" "${args[@]}"
          fi

          # Take whatever the release says now -- generated notes, or notes a human wrote --
          # drop any previous image block, and put the current one at the end.
          gh release view "$TAG" --json body --jq .body > current-body.md
          # Drop the previous block, then trim trailing blank lines so repeated runs do not
          # grow the body by a newline each time.
          sed "/${START}/,/${END}/d" current-body.md \
            | awk 'NF{last=NR} {l[NR]=$0} END{for(i=1;i<=last;i++) print l[i]}' > kept-body.md
          { cat kept-body.md; echo; cat image-block.md; } > new-body.md
          gh release edit "$TAG" --notes-file new-body.md

          echo "release $TAG now points at ${IMAGE}:${VERSION}"
