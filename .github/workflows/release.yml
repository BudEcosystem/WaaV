name: Release

# Cut a release of the WaaV gateway: build and publish the multi-arch image (linux/amd64 +
# linux/arm64) and the stripped binary archives (linux-x86_64, linux-aarch64, with SHA256SUMS),
# then create (or update) the GitHub Release for the tag.
#
# The tag MUST equal gateway/Cargo.toml's version: `waav-gateway --version` is how an operator
# identifies a binary, so a mismatch fails the run before anything is built.
#
# Three ways in:
#   * publish a Release in the UI  -> the `release` event; this is how releases are actually cut
#   * push a tag `v1.2.3` or `1.2.3` -> the tag event
#   * run this workflow by hand    -> same, against a tag that already exists
# The last is what makes a release UPDATABLE: re-running against an existing tag re-publishes
# the image and rewrites the release body rather than failing on "already exists".
#
# The tag is used VERBATIM (checkout, release) and the version is it without a leading `v`.
# Both spellings are real here: release `v0.1.0` was cut against tag `0.1.0`.
#
# Publishes to registry.bud.studio/runtime/waav, the registry every other Bud service is
# pulled from (pde-ditto's imagePullSecret is `registry.bud.studio`).
#
# Secrets required: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN. The names say dockerhub and the
# registry is Harbor -- that mismatch is inherited from bud-runtime's release workflows,
# where the same two secrets authenticate to registry.bud.studio. Kept identical so one
# credential pair covers both repos.
#
# As of this commit THIS REPOSITORY HAS NO ACTIONS SECRETS AT ALL, so the first run will stop
# at the credentials check until they are added under
# Settings > Secrets and variables > Actions. That is deliberate: the alternative is a build
# that cannot push and a green tick.

on:
  release:
    types: [published]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release, with or without the v (e.g. 1.2.3). Must already exist."
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  IMAGE: registry.bud.studio/runtime/waav

# Publishing a Release in the UI creates the tag AND fires `release`, so one release matches
# two triggers here and starts two runs. They build the same image from the same tag, so the
# later one supersedes the earlier instead of queueing behind it -- `0.1.1` otherwise paid for
# the same Rust build twice.
concurrency:
  group: release-${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: resolve the tag
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Resolve the tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Precedence: an explicit dispatch input, then the release being published, then the
          # pushed ref. The tag is used AS IT IS -- an earlier version rewrote `0.1.0` to
          # `v0.1.0` and then checked out a ref that does not exist.
          TAG="${INPUT_TAG:-${EVENT_TAG:-$REF_NAME}}"
          VERSION="${TAG#v}"
          # A pre-release must not move :latest. Same rule as the sibling repo's release
          # workflows, so an -rc image cannot become the default pull for a cluster.
          if printf '%s' "$VERSION" | grep -qiE -- '-(rc|alpha|beta|pre|dev|hotfix|snapshot)'; then
            TAGS="${IMAGE}:${VERSION}"
            echo "::notice::Pre-release '${VERSION}' — :latest will not be moved."
          else
            TAGS="${IMAGE}:${VERSION}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo 'tags<<TAGS_EOF'; printf '%s\n' "$TAGS"; echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "publishing:"; printf '%s\n' "$TAGS" | sed 's/^/     /'

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Require the tag to equal the crate version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          CRATE="$(sed -n '1,20{s/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p;}' gateway/Cargo.toml | head -1)"
          # A gate, not a warning: the binary reports the CRATE version (`waav-gateway
          # --version`), and an operator verifying a supplied binary by that output could not
          # tell two releases apart when it disagreed with the tag (0.1.x tags shipped a binary
          # saying 1.0.0). Bump gateway/Cargo.toml in the release commit, then tag.
          if [ "$CRATE" != "$VERSION" ]; then
            echo "::error::tag ${VERSION} != gateway/Cargo.toml version ${CRATE}. Set the crate version to the tag (or tag the crate version) and re-run." >&2
            exit 1
          fi
          echo "tag matches gateway/Cargo.toml (${CRATE})"

      - name: Require the registry credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${USERNAME}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set on this repository." >&2
            echo "::error::They authenticate to registry.bud.studio (the names are inherited" >&2
            echo "::error::from bud-runtime, where the same pair is used). Add them under" >&2
            echo "::error::Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

  image:
    name: build + publish image (${{ matrix.suffix }})
    needs: meta
    # Native runners per architecture, as bud-runtime's release workflows do: QEMU for a Rust +
    # ONNX build is not a substitute. 8 vCPU because this is a Rust build with ONNX in it.
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2204
            platform: linux/amd64
            suffix: amd64
          - runner: blacksmith-8vcpu-ubuntu-2204-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to registry.bud.studio
        uses: docker/login-action@v3
        with:
          registry: registry.bud.studio
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Context is the REPO ROOT, not gateway/: the Dockerfile copies the sibling crates
      # (bud-auth, waav-openai-audio, plugin-api) that gateway/Cargo.toml depends on by path.
      # Building from gateway/ fails at `COPY bud-auth /app/bud-auth`.
      - name: Build and push the ${{ matrix.suffix }} image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: gateway/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}-${{ matrix.suffix }}
          provenance: false

  manifest:
    name: publish the multi-arch manifest
    needs: [meta, image]
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Log in to registry.bud.studio
        uses: docker/login-action@v3
        with:
          registry: registry.bud.studio
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Join the per-architecture images
        id: manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" \
              "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          done <<< "$TAGS"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### WaaV ${VERSION}"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| image | \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64) |"
            echo "| digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  binaries:
    name: binary archive (linux-${{ matrix.arch }})
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2204
            arch: x86_64
          - runner: blacksmith-8vcpu-ubuntu-2204-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # The production feature set: the same one gateway/Dockerfile and CI's gating jobs build.
      FEATURES: dag-routing,turn-ensemble,noise-filter,openapi
      # Same as gateway/Dockerfile's RUST_VERSION.
      RUST_VERSION: "1.96.0"
      # webrtc-sys enables the NVIDIA codec when <CUDA_HOME>/include/cuda.h exists.
      CUDA_HOME: /tmp/nocuda
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with: { workspaces: gateway, key: "release-${{ matrix.arch }}" }

      - uses: ./.github/actions/native-deps

      - name: Build
        working-directory: gateway
        run: cargo build --release --locked --features "$FEATURES"

      - name: Pack
        id: pack
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          NAME="waav-gateway-${VERSION}-linux-${ARCH}"
          mkdir -p "dist/${NAME}"
          cp gateway/target/release/waav-gateway "dist/${NAME}/"
          strip "dist/${NAME}/waav-gateway"
          cp gateway/LICENSE "dist/${NAME}/"
          BIN="dist/${NAME}/waav-gateway"
          GLIBC="$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          {
            echo "waav-gateway ${VERSION}"
            echo "commit: $(git rev-parse HEAD)"
            echo "target: $(rustc -vV | sed -n 's/^host: //p')"
            echo "rustc: $(rustc --version)"
            echo "cargo features: ${FEATURES}"
            echo "glibc floor: ${GLIBC#GLIBC_}"
            echo "shared libraries: $(ldd "$BIN" | awk '{print $1}' | grep -v '^/' | sort -u | tr '\n' ' ')"
            echo "ONNX Runtime: loaded at run time (ort 2.0.0-rc.10, load-dynamic); needs 1.22 or newer."
            echo "  Point ORT_DYLIB_PATH at libonnxruntime.so; the release image ships 1.23.2."
          } > "dist/${NAME}/BUILD-INFO"
          cat "dist/${NAME}/BUILD-INFO"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          echo "archive=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the packed binary
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          tar -C "$T" -xzf "$ARCHIVE"
          GOT="$("$T"/waav-gateway-*/waav-gateway --version)"
          if [ "$GOT" != "waav-gateway ${VERSION}" ]; then
            echo "::error::--version printed '${GOT}', expected 'waav-gateway ${VERSION}'" >&2
            exit 1
          fi
          echo "ok: ${GOT}"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.arch }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error

  release:
    name: create or update the release
    needs: [meta, manifest, binaries]
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          # The image block is delimited so a re-run REPLACES it instead of adding another
          # copy. softprops/action-gh-release with append_body did the latter: re-running
          # 0.1.1 left the release carrying three "What's Changed" sections and two image
          # blocks, which is the opposite of what an updatable release should do.
          START='<!-- waav-release-image:start -->'
          END='<!-- waav-release-image:end -->'
          {
            echo "$START"
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "${DIGEST}"
            echo '```'
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`. The digest is the multi-arch index;"
            echo "\`docker pull\` picks the platform's image from it."
            echo
            echo "Pull by digest to pin exactly what was tested:"
            echo '```bash'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "## Binaries"
            echo
            echo "\`waav-gateway-${VERSION}-linux-x86_64.tar.gz\` and \`waav-gateway-${VERSION}-linux-aarch64.tar.gz\`,"
            echo "each with the stripped binary, \`LICENSE\` and \`BUILD-INFO\` (commit, features, glibc floor,"
            echo "ONNX Runtime requirement). Verify with \`sha256sum -c SHA256SUMS\`."
            echo "$END"
          } > image-block.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — updating it"
          else
            echo "release $TAG does not exist — creating it"
            args=(--title "$VERSION" --generate-notes)
            case "$VERSION" in *-*) args+=(--prerelease) ;; esac
            [ "${DRAFT:-false}" = "true" ] && args+=(--draft)
            gh release create "$TAG" "${args[@]}"
          fi

          # Take whatever the release says now -- generated notes, or notes a human wrote --
          # drop any previous image block, and put the current one at the end.
          gh release view "$TAG" --json body --jq .body > current-body.md
          # Drop the previous block, then trim trailing blank lines so repeated runs do not
          # grow the body by a newline each time.
          sed "/${START}/,/${END}/d" current-body.md \
            | awk 'NF{last=NR} {l[NR]=$0} END{for(i=1;i<=last;i++) print l[i]}' > kept-body.md
          { cat kept-body.md; echo; cat image-block.md; } > new-body.md
          gh release edit "$TAG" --notes-file new-body.md

          # The archives and their checksums. --clobber so a re-run replaces them.
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber

          echo "release $TAG now points at ${IMAGE}:${VERSION} and carries both archives"
